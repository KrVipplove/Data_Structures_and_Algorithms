<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media- HTML</title>
</head>
<body>

    <h1>Media in HTML</h1>
    <!-- <br> -->
    
    <div>
        <h2>Video:</h2>
        <video src="dance.mp4" height="400" controls autoplay loop muted poster="image2.jpg"></video>
    </div>

    <br>
    <div>
        <h2>Audio:</h2>
        <audio src="audio.mp3" controls autoplay loop muted></audio>
    </div>


    <br>
    <div>
        <h2>SVG Image:</h2>
        <svg height="100" width="100">
            <circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="red" />
        </svg>
    </div>

    
    <br>
    <div>
        <h2>SVG Image using image.svg:</h2>
        <img src="img.svg" alt="SVG Image">
    </div>


    <br>
    <div>
        <h2>Website embedding:</h2>
        <iframe src="https://www.wikipedia.org" height="310" width="550"></iframe>
    </div>


    <br>
    <div>
        <h2>YouTube video embedding:</h2>
        <iframe width="550" height="310" src="https://www.youtube.com/embed/mx6MzHYzEfY?si=2vLkX-Zwtm_JmSm2&amp;start=2" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

    
</body>
</html>
